name: update-tracker

# Runs entirely on GitHub — no home server, no cron on any of your machines.
on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 h at :17 (off the top of the hour, when GitHub is congested)
  workflow_dispatch: {}          # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["build/**", "pipeline/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write                # to commit refreshed data
  issues: write                  # to open (and later close) an issue when a run fails
  pages: write                   # to publish
  id-token: write                # required by deploy-pages

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch from Artificial Analysis
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          if [ -z "$AA_API_KEY" ]; then
            echo "::error::AA_API_KEY secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          python3 pipeline/fetch.py
          python3 scripts/build_data.py

      - name: Fetch GPU rental prices and exchange rates (never fail the run)
        run: |
          python3 pipeline/fetch_hardware.py || echo "::warning::GPU rental fetch failed; using the committed file"
          python3 pipeline/fetch_fx.py       || echo "::warning::exchange-rate fetch failed; using the committed file"

      - name: Rebuild the page
        # the runner image ships Google Chrome, which renders the social card (og.png)
        run: python3 build/build_page.py

      - name: Commit only if the data actually changed
        id: commit
        run: |
          git config user.name  "acceleration-bot"
          git config user.email "bot@users.noreply.github.com"

          # Compare the releases themselves, not the files: generated_utc moves on
          # every run, so a plain git diff would commit four times a day forever.
          git show HEAD:data/releases.json > "$RUNNER_TEMP/prev.json" 2>/dev/null \
            || echo '{"rows": []}' > "$RUNNER_TEMP/prev.json"
          CHANGED=$(python3 scripts/data_changed.py "$RUNNER_TEMP/prev.json")
          # a new week of GPU rental prices is news too (the file carries no timestamp)
          if ! git diff --quiet -- data/gpu_rental.json 2>/dev/null || [ -n "$(git ls-files --others -- data/gpu_rental.json)" ]; then
            CHANGED=true
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          if [ "$CHANGED" = "false" ]; then
            echo "No data change — nothing to commit."
            exit 0
          fi

          git add data
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0

          # The schedule and a human push can land together. Rebase and retry, and
          # never fail the job over it: a lost commit costs nothing, a skipped
          # deploy costs the whole page.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt) — rebasing on the new head"
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::warning::could not push the data commit; the site will still publish"
          exit 0

      - name: Check whether data moved
        id: delta
        run: echo "changed=${{ steps.commit.outputs.changed }}" >> "$GITHUB_OUTPUT"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site            # only the built page — never the pipeline or data files

      # One issue, not one per failure: a broken run opens it (or comments on it), and
      # the next good run closes it. The page shows its own banner once data is 24h old,
      # which also covers the case GitHub stops scheduling the workflow altogether.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title Refresh job failing" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "${{ github.repository }}" --body "Failed again: $url"
          else
            gh issue create --repo "${{ github.repository }}" --title "Refresh job failing" \
              --body "The scheduled refresh failed: $url. The site keeps serving the last good build; it shows a stale-data banner once that is 24 hours old. This issue closes itself on the next successful run."
          fi

      - name: Close the failure issue once a run succeeds
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "${{ github.repository }}" --state open --search "in:title Refresh job failing" --json number -q '.[].number'); do
            gh issue close "$n" --repo "${{ github.repository }}" --comment "Recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

  publish:
    needs: refresh
    # always publish: a fresh site must go live even when the data is unchanged
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
